# Evora : build web (WASM) du fork tazerty/effectcraft, futur moteur d'Evora Kinetika.
#
# Écrit par Evora (patchs EVORA-KIN-00 à 02, puis EVORA-KIN-04 « CI : portes bloquantes ») à
# partir de packaging/web/package.sh et de docs/web.md de ce dépôt (MIT OR Apache-2.0). Rien n'est
# repris de storytold/craft-common-actions. Accord de Gabriel du 2026-10-12 (D-2) : poussée de la
# branche evora/<tag>, activation d'Actions sur ce fork, code d'application sur la branche.
#
# - Aucune action tierce : seulement actions/checkout, actions/cache et actions/upload-artifact,
#   épinglées par SHA complet. Les scripts des portes sont écrits par Evora (.github/evora/).
# - Outils à version exacte, vérifiés : Rust (rustup), wasm-bindgen-cli (version de Cargo.lock et
#   de xtask), cargo-deny et cargo-about (binaires de leur release, SHA-256 épinglé ci-dessous).
#   Chrome, Node, Python, Perl, gzip et brotli sont ceux de l'image ubuntu-24.04, épinglée (jamais
#   ubuntu-latest, qui change d'image sans commit) : leurs versions sont imprimées au journal.
# - Portes BLOQUANTES depuis E1 (EVORA-KIN-03) : témoins des détecteurs ; cargo-deny (avis de
#   sécurité, interdits, licences et sources depuis EVORA-KIN-23, deny.toml, avec un témoin de
#   source git non admise) ; cargo-about (LICENSES/THIRD-PARTY-LICENSES.txt, --fail) ;
#   fichiers d'hébergement absents ; marques ArtCraft absentes du site ; .br/.gz vérifiés ;
#   empreintes CSP des scripts inline (csp-hashes.txt) ; test de fumée Chrome (iframe d'une autre
#   origine, puis sous la CSP prévue, plus un témoin saboté qui doit échouer) ; evora-host.json
#   livré neutre, pont muet ; banc « pont-ehp » : pont EHP v1 natif (E4, EVORA-KIN-14), espace de
#   noms reçu par evora:init et purge (E5, EVORA-KIN-15), avec un témoin muet et un témoin de purge
#   sabotée qui doivent échouer (EVORA-KIN-16) ; dans chaque passe, périphérique graphique vivant
#   et widgets à l'écran (EVORA-KIN-25, Vulkan sur SwiftShader depuis EVORA-KIN-28), avec un
#   témoin de perte du périphérique qui doit échouer. L'audit des émojis
#   des catalogues (E10, EVORA-KIN-06) et les termes sensibles (E9, EVORA-KIN-08), mesurés
#   jusqu'à leur patch, sont bloquants depuis (variables EVORA_* ci-dessous).
# - L'artefact n'est envoyé qu'après toutes les portes : un artefact publié a passé les portes. Il
#   porte le nom Evora (evora-kinetika-web-<tag>) depuis EVORA-KIN-07, une fois E1 posé et les
#   portes vertes, jamais avant.
# - Montée D-19 vers v0.11.1 (EVORA-KIN-30) : série EVORA-KIN-00 à 29 rejouée par cherry-pick
#   depuis evora/v0.9.2 ; workflow amont neuf nix.yml retiré de la branche, comme les quatre
#   retirés par EVORA-KIN-00 ; Rust réaligné sur le build de release du tag.
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version du build de release amont du tag (job « Web (wasm) » de v0.17.0, run 40197985720 :
  # rustc 1.99.1 (58cf8f9c3 2026-10-13), comme pour v0.11.1), réalignée à chaque montée
  # (EVORA-KIN-30, EVORA-KIN-34, D-19).
  RUST_TOOLCHAIN: "1.99.1"
  WASM_BINDGEN_CLI: "0.2.129"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
  # Piles de polices de l'audit des catalogues : `evora` depuis E10 (theme.rs, faces de texte
  # avant les faces émoji).
  EVORA_FONT_STACKS: "evora"
  # Audit des émojis des catalogues : bloquant depuis E10 (EVORA-KIN-06).
  EVORA_EMOJI_GATE: "block"
  # Termes sensibles (Lumetri, Lightroom, Acrobat, Premiere, Adobe, Cycore) : bloquants depuis E9
  # (EVORA-KIN-08), dans les chaînes affichées après le catalogue de surcharge et au rendu.
  EVORA_TERMS_GATE: "block"
  # Liens externes lancés dans le moteur (commandes Help) : aucune page ouverte, aucune erreur,
  # bloquant depuis E7 (EVORA-KIN-09).
  EVORA_LINKS_GATE: "block"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify the upstream tag
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            evora/v*) ;;
            *) echo "::error::la branche $ref n'est pas de la forme evora/<tag>"; exit 1 ;;
          esac
          tag="${ref#evora/}"
          # [workspace.package] version, lue comme packaging/env.sh
          version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Cargo.toml annonce $version, la branche vise $tag"
            exit 1
          fi
          # La version du CLI épinglée ici doit être celle qu'exigent xtask et Cargo.lock.
          xtask_wb="$(sed -n 's/^const WASM_BINDGEN: &str = "\(.*\)";$/\1/p' xtask/src/main.rs)"
          lock_wb="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          if [ "$xtask_wb" != "$WASM_BINDGEN_CLI" ] || [ "$lock_wb" != "$WASM_BINDGEN_CLI" ]; then
            echo "::error::wasm-bindgen épinglé $WASM_BINDGEN_CLI, xtask $xtask_wb, Cargo.lock $lock_wb"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            # Nom Evora depuis EVORA-KIN-07 : E1 posé et portes vertes (runs 38365896075 et 38369996105).
            echo "name=evora-kinetika-web-$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Tag amont $tag, version $version, commit $(git rev-parse HEAD)"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} (rustup)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo "::error::rustup absent de l'image du runner"; exit 1; }
          rustup --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUST_TOOLCHAIN" wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" rustc --version --verbose
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" cargo --version

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: evora-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-cargo-${{ runner.os }}-

      - name: Cache wasm-bindgen CLI
        id: wbcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-tools/wasm-bindgen
          key: evora-wasm-bindgen-cli-${{ env.WASM_BINDGEN_CLI }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen CLI ${{ env.WASM_BINDGEN_CLI }}
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_CLI" --locked --root "$HOME/.evora-tools/wasm-bindgen"

      - name: Check tools
        run: |
          set -euo pipefail
          echo "$HOME/.evora-tools/wasm-bindgen/bin" >> "$GITHUB_PATH"
          wb="$("$HOME/.evora-tools/wasm-bindgen/bin/wasm-bindgen" --version)"
          echo "$wb"
          case "$wb" in
            *"$WASM_BINDGEN_CLI"*) ;;
            *) echo "::error::wasm-bindgen $wb au lieu de $WASM_BINDGEN_CLI"; exit 1 ;;
          esac
          if command -v wasm-opt >/dev/null; then
            echo "::notice::wasm-opt présent sur le runner ($(wasm-opt --version)) : xtask l'appliquera"
          else
            echo "wasm-opt absent : xtask saute l'optimisation binaryen (comme la release amont)"
          fi

      - name: Install audit tools (cargo-deny ${{ env.CARGO_DENY_VERSION }}, cargo-about ${{ env.CARGO_ABOUT_VERSION }}, SHA-256 pinned)
        run: |
          set -euo pipefail
          bin="$HOME/.evora-tools/audit/bin"
          mkdir -p "$bin"
          fetch() {
            local name="$1" ver="$2" sum="$3"
            local tgz="$name-$ver-x86_64-unknown-linux-musl.tar.gz"
            local dl="$RUNNER_TEMP/evora-dl/$name"
            mkdir -p "$dl"
            curl -fsSL --retry 3 -o "$dl/$tgz" "https://github.com/EmbarkStudios/$name/releases/download/$ver/$tgz"
            echo "$sum  $dl/$tgz" | sha256sum -c -
            tar -xzf "$dl/$tgz" -C "$dl"
            local exe
            exe="$(find "$dl" -type f -name "$name" | head -n 1)"
            [ -n "$exe" ] || { echo "::error::$name introuvable dans $tgz"; exit 1; }
            install -m 0755 "$exe" "$bin/$name"
          }
          fetch cargo-deny "$CARGO_DENY_VERSION" "$CARGO_DENY_SHA256"
          fetch cargo-about "$CARGO_ABOUT_VERSION" "$CARGO_ABOUT_SHA256"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cargo-deny" --version | tee /dev/stderr | grep -qF "$CARGO_DENY_VERSION" || { echo "::error::cargo-deny n'est pas $CARGO_DENY_VERSION"; exit 1; }
          "$bin/cargo-about" --version | tee /dev/stderr | grep -qF "$CARGO_ABOUT_VERSION" || { echo "::error::cargo-about n'est pas $CARGO_ABOUT_VERSION"; exit 1; }

      - name: Runner tools of the gates (versions)
        run: |
          set -euo pipefail
          google-chrome --version
          node --version
          python3 --version
          perl -MUnicode::UCD -e 'printf "perl %vd, Unicode %s\n", $^V, Unicode::UCD::UnicodeVersion()'
          brotli --version
          gzip --version | head -n 1
          zip -v | sed -n 2p
          if node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)'; then
            echo "NODE_WS=" >> "$GITHUB_ENV"
          else
            echo "NODE_WS=--experimental-websocket" >> "$GITHUB_ENV"
            echo "Node sans WebSocket global : --experimental-websocket"
          fi

      - name: Gate witnesses (every detector must see what it is shown)
        run: python3 .github/evora/gates.py witness

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      # cargo-deny complet depuis EVORA-KIN-23 (CI-DENY-KIN) : avis, interdits, licences et sources
      # (crates.io, storytold/filmcraft et storytold/craft-libs seulement, deny.toml). Témoin : une
      # copie de deny.toml dont allow-git n'admet plus storytold/filmcraft doit faire rougir la
      # catégorie « sources » sur ses crates, d'un seul motif, sans nommer craft-libs (craft-ui).
      - name: Advisories, bans, licences and sources (cargo-deny, web crate graph, wasm32)
        run: |
          set -euo pipefail
          deny() { cargo deny --manifest-path apps/effectcraft-web/Cargo.toml --config "$1" --locked --color never check --show-stats "${@:2}"; }
          deny deny.toml advisories bans licenses sources
          sab="$RUNNER_TEMP/evora-deny-sabotage.toml"
          log="$RUNNER_TEMP/evora-deny-sabotage.log"
          python3 - deny.toml "$sab" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          s = open(src, encoding="utf-8").read()
          a = '    "https://github.com/storytold/filmcraft",\n'
          if s.count(a) != 1:
              sys.exit(f"allow-git storytold/filmcraft introuvable (ou multiple) dans {src}")
          open(dst, "w", encoding="utf-8").write(s.replace(a, ""))
          PY
          cmp -s deny.toml "$sab" && { echo "::error::copie sabotée de deny.toml identique à l'original"; exit 1; }
          if deny "$sab" sources > "$log" 2>&1; then
            cat "$log"
            echo "::error::témoin des sources : une source git non admise (storytold/filmcraft) passe cargo-deny"
            exit 1
          fi
          codes="$(grep -oE '^error\[[a-z0-9-]+\]' "$log" | sort -u | tr '\n' ' ' || true)"
          ncodes="$(grep -oE '^error\[[a-z0-9-]+\]' "$log" | sort -u | wc -l | tr -d ' ' || true)"
          # craft-libs et craft-ui comme mots (« effectcraft-ui-egui » n'est pas craft-ui).
          if grep -q 'sources FAILED' "$log" && grep -q 'filmcraft' "$log" && ! grep -qE '(^|[^A-Za-z0-9_-])craft-(libs|ui)([^A-Za-z0-9_-]|$)' "$log" && [ "$ncodes" = 1 ]; then
            echo "Témoin des sources OK : $(grep -c '^error\[' "$log") erreur(s) $codes sur storytold/filmcraft ; $(grep 'sources FAILED' "$log")"
          else
            cat "$log"
            echo "::error::témoin des sources : cargo-deny ne rougit pas exactement sur la source git retirée (motifs : $codes)"
            exit 1
          fi

      - name: Build the web app (cargo xtask web, release)
        run: |
          set -euo pipefail
          cargo xtask web
          git diff --exit-code -- Cargo.lock || { echo "::error::le build a modifié Cargo.lock"; exit 1; }

      - name: Third-party licences (cargo-about)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evora-about"
          cargo about generate --manifest-path apps/effectcraft-web/Cargo.toml --locked --fail \
            -c .github/evora/about.toml -o "$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt" \
            .github/evora/third-party-licenses.hbs
          f="$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt"
          [ -s "$f" ] || { echo "::error::cargo-about n'a rien produit"; exit 1; }
          echo "THIRD-PARTY-LICENSES.txt : $(wc -c < "$f") octets, $(grep -c '^- .* crates)$' "$f") licences, $(grep -cE '^- [A-Za-z0-9_-]+ [0-9]' "$f") mentions de crates"
          sed -n '/^Overview/,/^---/p' "$f"

      - name: Package the static site
        id: pkg
        env:
          NAME: ${{ steps.meta.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          site="target/web/dist"
          [ -f "$site/index.html" ] || { echo "::error::$site/index.html manquant"; exit 1; }
          # Les URL doivent rester relatives : le site est servi sous un sous-chemin.
          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo "::error::$site/index.html contient des URL absolues depuis la racine"
            exit 1
          fi
          work="$RUNNER_TEMP/evora-pkg"
          out="$RUNNER_TEMP/evora-out"
          mkdir -p "$work/$NAME/LICENSES" "$out"
          cp -R "$site/." "$work/$NAME/"
          # Aucune configuration d'hébergement (_headers, .htaccess) : l'hôte Evora pose ses en-têtes.
          # Licences et mentions amont conservées (MIT OR Apache-2.0, NOTICE, polices OFL), licences
          # tierces agrégées par cargo-about, mention Evora en texte simple.
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$work/$NAME/LICENSES/"
          cp assets/fonts/OFL-*.txt "$work/$NAME/LICENSES/"
          cp "$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt" "$work/$NAME/LICENSES/"
          sed -e "s/__TAG__/$TAG/g" -e "s/__COMMIT__/$(git rev-parse HEAD)/g" .github/evora/NOTICE-EVORA.txt > "$work/$NAME/LICENSES/NOTICE-EVORA.txt"
          # Copies précompressées pour l'origine du moteur (Content-Encoding br et gzip).
          (
            cd "$work/$NAME"
            find . -type f -not -path './LICENSES/*' \( -name '*.wasm' -o -name '*.js' -o -name '*.mjs' -o -name '*.html' \
              -o -name '*.svg' -o -name '*.webmanifest' -o -name '*.json' -o -name '*.css' \) -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' f; do
                gzip -9 -n -k "$f"
                brotli -q 11 -k "$f"
              done
          )
          # E4 : origines parentes admises par le pont EHP (?host=evora), après la précompression (un
          # .br/.gz périmé survivrait au provisionnement). Vide dans l'artefact : le pont reste muet
          # tant que le provisionnement d'Evora ne l'a pas écrit depuis engines.json
          # (HOST-PROTOCOL §2.3) ; même contrat que le Colophon Atelier (pdfcraft).
          printf '{"parentOrigins": []}\n' > "$work/$NAME/evora-host.json"
          {
            echo "dir=$work/$NAME"
            echo "work=$work"
            echo "out=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Gates on the site (hosting files, ArtCraft marks, provisioned files, .br/.gz, CSP hashes, sizes)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: python3 .github/evora/gates.py site --dir "$DIR"

      - name: Gate on the displayed catalogues (emoji and symbols, E10)
        run: python3 .github/evora/gates.py catalog --repo . --stacks "$EVORA_FONT_STACKS" --mode "$EVORA_EMOJI_GATE"

      - name: Gate on sensitive terms after the display-name overrides (E9)
        run: python3 .github/evora/gates.py terms --repo . --mode "$EVORA_TERMS_GATE"

      # Relevé de surface (NR-12, EVORA-KIN-33) : RAPPORT, jamais une porte. Graphe des crates du
      # build web (wasm32, dépendances normales), imports du module WebAssembly et primitives réseau
      # des scripts du site, à comparer au build de la branche précédente à chaque montée.
      - name: Surface report (NR-12, report only)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          set +e
          cargo tree --manifest-path apps/effectcraft-web/Cargo.toml --locked -e normal \
            --target wasm32-unknown-unknown --prefix none --format '{p}' | LC_ALL=C sort -u | sed 's/^/SURFACE tree /'
          echo "SURFACE tree status=${PIPESTATUS[0]}"
          python3 .github/evora/surface.py imports --wasm "$DIR/effectcraft_web_bg.wasm"
          python3 .github/evora/surface.py net --dir "$DIR"
          exit 0

      # Témoin moteur du banc « pont-ehp » (EVORA-KIN-20) : la même crate web construite avec la
      # fonctionnalité evora-witness, qui casse exprès ce que le banc doit attraper (réponses qui
      # attendent une image, contrôle de la source, evora:dirty après l'enregistrement, purge sans
      # arrêt des écritures et accusée avant l'effacement). Servie par le banc seulement, sur une copie
      # du site : jamais dans l'artefact, qui est déjà empaqueté et passé par ses portes.
      - name: Build the bench's witness engine (feature evora-witness, never published)
        id: witness
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          set -euo pipefail
          cargo build --locked --target wasm32-unknown-unknown -p effectcraft-web --profile release --features evora-witness
          git diff --exit-code -- Cargo.lock || { echo "::error::le build du témoin a modifié Cargo.lock"; exit 1; }
          wout="$RUNNER_TEMP/evora-witness-wasm"
          site="$RUNNER_TEMP/evora-witness-site"
          mkdir -p "$wout" "$site"
          wasm-bindgen --target web --no-typescript --out-dir "$wout" target/wasm32-unknown-unknown/release/effectcraft_web.wasm
          # Le site de l'artefact sans son moteur (wasm, colle JS, snippets), puis le moteur témoin.
          (cd "$DIR" && tar --exclude='./snippets' --exclude='./effectcraft_web*' -cf - .) | (cd "$site" && tar -xf -)
          cp -R "$wout/." "$site/"
          [ -f "$site/effectcraft_web_bg.wasm" ] && [ -f "$site/effectcraft_web.js" ] || { echo "::error::moteur témoin incomplet"; exit 1; }
          cmp -s "$DIR/effectcraft_web_bg.wasm" "$site/effectcraft_web_bg.wasm" && { echo "::error::le moteur témoin est celui de l'artefact"; exit 1; }
          [ "$(cd "$site" && ls snippets/*/js/host.js | wc -l)" = 1 ] || { echo "::error::js/host.js du témoin introuvable ou multiple"; exit 1; }
          echo "Moteur témoin : $(stat -c %s "$site/effectcraft_web_bg.wasm") octets (artefact : $(stat -c %s "$DIR/effectcraft_web_bg.wasm"))"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Smoke test (headless Chrome, engine framed by another origin)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          WITNESS: ${{ steps.witness.outputs.site }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/evora-smoke"
          mkdir -p "$smoke/parent"
          PB=8602; PA=8601; PC=8603; PS=8604
          # Banc « pont-ehp » (E4, E5) : moteur dont evora-host.json admet le parent (PE), moteur
          # dont evora-host.json admet une autre origine (PT, témoin muet), fenêtre intruse d'une
          # origine non admise (PR).
          PE=8605; PT=8606; PR=8607
          # Témoin de purge sabotée (E5) : moteur servi avec un js/host.js dont la purge
          # d'evora:purge répond aussitôt, sans rien arrêter ni effacer (PZ).
          PZ=8608
          # Témoin moteur (EVORA-KIN-20) : le moteur construit avec evora-witness (PW).
          PW=8609
          # Témoin de perte du périphérique graphique (EVORA-KIN-25) : la page du moteur servie avec
          # un script qui détruit tout périphérique WebGPU dès sa création (PL).
          PL=8610
          hashes="$(grep -o "^'sha256-[^']*'" "$DIR/csp-hashes.txt" | tr '\n' ' ')"
          [ -n "$hashes" ] || { echo "::error::csp-hashes.txt vide"; exit 1; }
          # La CSP prévue pour les documents du moteur (apps/kinetika/CLAUDE.md §6.5), le parent
          # tenant lieu d'origine Evora.
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' ${hashes}; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors http://127.0.0.1:$PB; object-src 'none'; base-uri 'none'"
          sabotaged="${csp//sha256-/sha256-SABOTAGE}"
          # Banc « pont-ehp » : coquille minimale et fenêtre intruse (servies par le parent et par PR),
          # evora-host.json tel que l'écrirait le provisionnement d'Evora (PE : le parent admis ; PT :
          # une autre origine), page d'amorçage du banc sur l'origine du moteur. L'artefact n'est pas
          # modifié : le serveur du banc sert ces chemins à la place des siens.
          cp .github/evora/ehp-parent.html .github/evora/ehp-rogue.html "$smoke/parent/"
          printf '{"parentOrigins": ["http://127.0.0.1:%s"]}\n' "$PB" > "$smoke/host-admit.json"
          printf '{"parentOrigins": ["http://127.0.0.1:1"]}\n' > "$smoke/host-other.json"
          seedmap="--map /evora-seed.html=.github/evora/ehp-seed.html --map /evora-seed.js=.github/evora/ehp-seed.js"
          # La copie sabotée de js/host.js (servie par PZ seulement ; l'artefact n'est pas modifié) :
          # storagePurge(mode, stop) rend {purged: [], remaining: []} dès qu'on lui demande d'arrêter
          # les écritures, soit un accusé d'evora:purge avant tout effacement.
          hostjs="$(cd "$DIR" && ls snippets/*/js/host.js)"
          [ "$(printf '%s\n' "$hostjs" | wc -l)" = 1 ] || { echo "::error::js/host.js introuvable ou multiple dans le site : $hostjs"; exit 1; }
          python3 - "$DIR/$hostjs" "$smoke/host-purge-sabotage.js" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          s = open(src, encoding="utf-8").read()
          a = "export async function storagePurge(mode, stop) {\n"
          if s.count(a) != 1:
              sys.exit(f"storagePurge introuvable dans {src}")
          open(dst, "w", encoding="utf-8").write(s.replace(a, a + "  if (stop) return { purged: [], remaining: [] };\n"))
          PY
          cmp -s "$DIR/$hostjs" "$smoke/host-purge-sabotage.js" && { echo "::error::copie sabotée de js/host.js identique à l'original"; exit 1; }
          # La copie sabotée de la page du moteur (servie par PL seulement) : lose-device.js chargé
          # avant le script de démarrage, dont l'empreinte CSP est inchangée.
          python3 - "$DIR/index.html" "$smoke/index-lose-device.html" <<'PY'
          import sys
          src, dst = sys.argv[1:]
          s = open(src, encoding="utf-8").read()
          a = '<script type="module">'
          if s.count(a) != 1:
              sys.exit(f"script de démarrage introuvable (ou multiple) dans {src}")
          open(dst, "w", encoding="utf-8").write(s.replace(a, '<script src="evora-lose-device.js"></script>' + a))
          PY
          cmp -s "$DIR/index.html" "$smoke/index-lose-device.html" && { echo "::error::copie sabotée d'index.html identique à l'original"; exit 1; }
          for p in "$PA" "$PC" "$PS" "$PL"; do
            # La passe sous CSP impose aussi la langue (E3, ?lang=fr) et le thème (E2, ?theme=light).
            if [ "$p" = "$PC" ]; then extra="&amp;lang=fr&amp;theme=light"; else extra=""; fi
            cat > "$smoke/parent/engine-$p.html" <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Evora smoke parent</title><link rel="icon" href="data:,"></head>
          <body style="margin:0"><iframe id="engine" src="http://127.0.0.1:$p/index.html?storage=memory&amp;nosw$extra" style="border:0;width:1360px;height:860px" allow="fullscreen; clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin"></iframe></body></html>
          HTML
          done
          python3 .github/evora/serve.py --root "$smoke/parent" --port "$PB" > "$smoke/serve-parent.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PA" > "$smoke/serve-plain.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PC" --header "Content-Security-Policy: $csp" > "$smoke/serve-csp.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PS" --header "Content-Security-Policy: $sabotaged" > "$smoke/serve-sabotage.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PE" --header "Content-Security-Policy: $csp" \
            --map "/evora-host.json=$smoke/host-admit.json" $seedmap > "$smoke/serve-ehp.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PT" --header "Content-Security-Policy: $csp" \
            --map "/evora-host.json=$smoke/host-other.json" $seedmap > "$smoke/serve-ehp-muet.log" 2>&1 &
          python3 .github/evora/serve.py --root "$smoke/parent" --port "$PR" > "$smoke/serve-intrus.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PZ" --header "Content-Security-Policy: $csp" \
            --map "/evora-host.json=$smoke/host-admit.json" --map "/$hostjs=$smoke/host-purge-sabotage.js" $seedmap > "$smoke/serve-purge-sabotage.log" 2>&1 &
          python3 .github/evora/serve.py --root "$WITNESS" --port "$PW" --header "Content-Security-Policy: $csp" \
            --map "/evora-host.json=$smoke/host-admit.json" $seedmap > "$smoke/serve-temoin-moteur.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PL" --header "Content-Security-Policy: $csp" \
            --map "/index.html=$smoke/index-lose-device.html" --map "/evora-lose-device.js=.github/evora/lose-device.js" > "$smoke/serve-temoin-peripherique.log" 2>&1 &
          for p in "$PB" "$PA" "$PC" "$PS" "$PE" "$PT" "$PR" "$PZ" "$PW" "$PL"; do
            for _ in $(seq 1 50); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$p/" || true)"
              [ "$code" != "000" ] && break
              sleep 0.2
            done
            [ "$code" != "000" ] || { echo "::error::serveur du port $p muet"; exit 1; }
          done
          curl -fsSI "http://127.0.0.1:$PA/effectcraft_web_bg.wasm" | grep -i '^content-type'
          echo "CSP prévue : $csp"
          rc=0
          node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PA.html" --engine="http://127.0.0.1:$PA" \
            --label=cross-origin --out="$smoke" --terms="$EVORA_TERMS_GATE" --links="$EVORA_LINKS_GATE" || rc=1
          node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PC.html" --engine="http://127.0.0.1:$PC" \
            --label=csp --out="$smoke" --terms="$EVORA_TERMS_GATE" --links="$EVORA_LINKS_GATE" --expect-lang=fr --expect-theme=light || rc=1
          # Pont EHP v1 natif (E4) et stockage par espace de noms reçu par evora:init (E5), sous la CSP
          # prévue : en mode mémoire comme l'impose Evora (pont-ehp), puis avec le stockage du
          # navigateur (pont-ehp-opfs). Un espace de noms planté dans l'URL doit être ignoré.
          ns="$(python3 -c 'print("e" * 64)')"
          urlns="$(python3 -c 'print("d" * 64)')"
          ehp_parent() {
            python3 -c 'import sys, urllib.parse as u; pb, engine, rogue, ns, q, prefs = sys.argv[1:]; print(f"http://127.0.0.1:{pb}/ehp-parent.html?" + u.urlencode({"engine": engine, "rogue": rogue, "ns": ns, "q": q, "prefs": prefs}))' "$PB" "$1" "http://127.0.0.1:$PR" "$ns" "$2" "$3"
          }
          node $NODE_WS .github/evora/smoke.mjs --engine="http://127.0.0.1:$PE" --label=pont-ehp --out="$smoke" --ehp=memory --ehp-ns="$ns" --ehp-url-ns="$urlns" \
            --parent="$(ehp_parent "http://127.0.0.1:$PE" "host=evora&storage=memory&nosw&storageNs=$urlns" '{"disk.diskCacheEnabled": false}')" || rc=1
          node $NODE_WS .github/evora/smoke.mjs --engine="http://127.0.0.1:$PE" --label=pont-ehp-opfs --out="$smoke" --ehp=opfs --ehp-ns="$ns" --ehp-url-ns="$urlns" \
            --parent="$(ehp_parent "http://127.0.0.1:$PE" "host=evora&nosw&storageNs=$urlns" '{}')" || rc=1
          # Témoins du banc « pont-ehp » (EVORA-KIN-20) : chacun doit rougir exactement sur les constats
          # de son sabordage (--witness-require), et sur rien d'autre que leurs conséquences déclarées
          # (--witness-tolerate) ; smoke.mjs le juge (SMOKE_WITNESS ok=true) et sa ligne SMOKE reste ok=false.
          witness() {
            local name="$1" out="$2"
            shift 2
            if node $NODE_WS .github/evora/smoke.mjs "$@" > "$out" 2>&1 && grep -q '^SMOKE .*ok=false' "$out" && grep -q '^SMOKE_WITNESS .*ok=true' "$out"; then
              echo "Témoin $name OK : $(grep '^SMOKE_WITNESS ' "$out")"
              grep '^SMOKE_FAIL ' "$out" || true
            else
              cat "$out"
              echo "::error::témoin $name : le banc ne rougit pas exactement sur les constats de son sabordage"
              rc=1
            fi
          }
          # Témoin muet : evora-host.json n'admet pas le parent ; aucun evora:ready, magasins étrangers
          # non purgés, et rien d'autre.
          witness muet "$smoke/ehp-temoin.out" --engine="http://127.0.0.1:$PT" --label=pont-ehp-temoin --out="$smoke" --ehp=memory --ehp-ns="$ns" --ehp-url-ns="$urlns" \
            --parent="$(ehp_parent "http://127.0.0.1:$PT" "host=evora&storage=memory&nosw" '{"disk.diskCacheEnabled": false}')" \
            --witness-require="[ehp] evora:ready : rien|[ehp] magasins étrangers non purgés au démarrage"
          # Témoin de purge sabotée : copie de js/host.js dont la purge d'evora:purge répond sans rien
          # arrêter ni effacer ; stockage non vide, aucune suppression, magasins du compte gardés.
          witness "de purge sabotée" "$smoke/ehp-purge-sabotee.out" --engine="http://127.0.0.1:$PZ" --label=pont-ehp-purge-sabotee --out="$smoke" --ehp=memory --ehp-ns="$ns" --ehp-url-ns="$urlns" \
            --parent="$(ehp_parent "http://127.0.0.1:$PZ" "host=evora&storage=memory&nosw" '{"disk.diskCacheEnabled": false}')" \
            --witness-require="[ehp] stockage du moteur non vide après evora:purge|[ehp] aucune suppression observée pendant la purge|[ehp] magasins du compte non supprimés avant l'accusé"
          # Témoin moteur (evora-witness), avec le stockage du navigateur : réponse à une fenêtre qui
          # n'est pas le parent, evora:dirty absent après l'enregistrement, aucune réponse tant que le
          # cadre n'est pas peint, accusé d'evora:purge avant les effacements et écritures après lui.
          # Tolérés : ce que ces deux derniers sabordages entraînent (stockage encore là ou recréé,
          # magasins effacés après l'accusé, erreurs de page des écritures refusées).
          witness moteur "$smoke/ehp-temoin-moteur.out" --engine="http://127.0.0.1:$PW" --label=pont-ehp-temoin-moteur --out="$smoke" --ehp=opfs --ehp-ns="$ns" --ehp-url-ns="$urlns" \
            --parent="$(ehp_parent "http://127.0.0.1:$PW" "host=evora&nosw" '{}')" \
            --witness-require="[ehp] réponse à un message refusé (rogueSource)|[ehp] evora:dirty {dirty: false} après l'enregistrement : rien|[ehp] evora:save en réponse à evora:request-save, cadre masqué : rien|[ehp] accusé d'evora:purge envoyé avant la fin des suppressions|[ehp] écriture du moteur après evora:purge" \
            --witness-tolerate="[ehp] stockage du moteur non vide après evora:purge|[ehp] le moteur a recréé un magasin après evora:purge|[ehp] magasins du compte non supprimés avant l'accusé|erreur(s) de page"
          # Témoin de perte du périphérique graphique (EVORA-KIN-25) : tout périphérique WebGPU de la
          # page est détruit dès sa création ; le banc doit rougir sur le périphérique perdu (motif
          # « Destroyed ») et sur l'écran vide. Une perte du runner peut porter le même motif (run
          # 39194377234) : le témoin ne discrimine que si les passes nominales sont vertes.
          witness "de perte du périphérique" "$smoke/temoin-peripherique.out" --parent="http://127.0.0.1:$PB/engine-$PL.html" --engine="http://127.0.0.1:$PL" \
            --label=temoin-peripherique --out="$smoke" --languages=en \
            --witness-require="périphérique graphique perdu : GPU device lost (Destroyed)|aucun widget à l'écran" \
            --witness-tolerate="erreur(s) de page"
          # Témoin saboté : sous une empreinte CSP fausse le moteur ne doit pas démarrer, et le test le dit.
          if node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PS.html" --engine="http://127.0.0.1:$PS" \
            --label=csp-sabotage --out="$smoke" --timeout=30000 --settle=500 > "$smoke/sabotage.out" 2>&1; then
            echo "::error::témoin saboté : le test de fumée passe sous une empreinte CSP fausse"
            rc=1
          elif ! grep -q 'SMOKE_CSP .*script-src' "$smoke/sabotage.out"; then
            cat "$smoke/sabotage.out"
            echo "::error::témoin saboté : échec sans violation de script-src relevée"
            rc=1
          else
            echo "Témoin saboté OK : $(grep '^SMOKE ' "$smoke/sabotage.out")"
          fi
          kill $(jobs -p) 2>/dev/null || true
          exit "$rc"

      - name: Archive (zip and SHA256SUMS)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          WORK: ${{ steps.pkg.outputs.work }}
          OUT: ${{ steps.pkg.outputs.out }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          # Archive reproductible : dates fixées au commit, ordre trié, sans attributs étendus ; les
          # fichiers déjà compressés (.br, .gz, .png) sont stockés tels quels.
          epoch="$(git log -1 --format=%ct)"
          (
            cd "$WORK"
            find "$NAME" -exec touch -h -d "@$epoch" {} +
            find "$NAME" -type f | LC_ALL=C sort | zip -q -X -9 -n .br:.gz:.png "$OUT/$NAME.zip" -@
          )
          cp "$DIR/csp-hashes.txt" "$OUT/csp-hashes.txt"
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS)
          cat "$OUT/SHA256SUMS"
          ls -l "$OUT"
          {
            echo "### Archive"
            echo
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Archive | \`$NAME.zip\`, $(stat -c %s "$OUT/$NAME.zip") octets |"
            echo "| SHA-256 | \`$(sha256sum "$OUT/$NAME.zip" | cut -d' ' -f1)\` |"
            echo
            echo '```'
            (cd "$DIR" && find . -type f -printf '%10s  %P\n' | LC_ALL=C sort -k2)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ARCHIVE_FILES"
          (cd "$DIR" && find . -type f -printf '%10s  %P\n' | LC_ALL=C sort -k2)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.out }}/${{ steps.meta.outputs.name }}.zip
            ${{ steps.pkg.outputs.out }}/SHA256SUMS
            ${{ steps.pkg.outputs.out }}/csp-hashes.txt
          if-no-files-found: error
          compression-level: 0

      # Empreinte seule, en artefact séparé : vérifiable sans télécharger l'archive.
      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-SHA256SUMS
          path: ${{ steps.pkg.outputs.out }}/SHA256SUMS
          if-no-files-found: error

      # Rapport du test de fumée (JSON, captures), aussi en cas d'échec, pour le diagnostic.
      - name: Upload smoke report
        if: always() && steps.meta.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-smoke
          path: ${{ runner.temp }}/evora-smoke/
          if-no-files-found: warn
          retention-days: 30
