# Evora : build web (WASM) du fork tazerty/effectcraft, futur moteur d'Evora Kinetika.
#
# Écrit par Evora (patchs EVORA-KIN-00 à 02, puis EVORA-KIN-04 « CI : portes bloquantes ») à
# partir de packaging/web/package.sh et de docs/web.md de ce dépôt (MIT OR Apache-2.0). Rien n'est
# repris de storytold/craft-common-actions. Accord de Gabriel du 2026-10-12 (D-2) : poussée de la
# branche evora/<tag>, activation d'Actions sur ce fork, code d'application sur la branche.
#
# - Aucune action tierce : seulement actions/checkout, actions/cache et actions/upload-artifact,
#   épinglées par SHA complet. Les scripts des portes sont écrits par Evora (.github/evora/).
# - Outils à version exacte, vérifiés : Rust (rustup), wasm-bindgen-cli (version de Cargo.lock et
#   de xtask), cargo-deny et cargo-about (binaires de leur release, SHA-256 épinglé ci-dessous).
#   Chrome, Node, Python, Perl, gzip et brotli sont ceux de l'image ubuntu-latest : leurs versions
#   sont imprimées au journal.
# - Portes BLOQUANTES depuis E1 (EVORA-KIN-03) : témoins des détecteurs ; cargo-deny (licences et
#   avis de sécurité, deny.toml) ; cargo-about (LICENSES/THIRD-PARTY-LICENSES.txt, --fail) ;
#   fichiers d'hébergement absents ; marques ArtCraft absentes du site ; .br/.gz vérifiés ;
#   empreintes CSP des scripts inline (csp-hashes.txt) ; test de fumée Chrome (iframe d'une autre
#   origine, puis sous la CSP prévue, plus un témoin saboté qui doit échouer). L'audit des émojis
#   des catalogues (E10) et les termes sensibles relus au rendu (E9) sont mesurés jusqu'à leur
#   patch, qui les rend bloquants (variables EVORA_* ci-dessous).
# - L'artefact n'est envoyé qu'après toutes les portes : un artefact publié a passé les portes.
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  WASM_BINDGEN_CLI: "0.2.129"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
  # Piles de polices de l'audit des catalogues : `evora` depuis E10 (theme.rs, faces de texte
  # avant les faces émoji).
  EVORA_FONT_STACKS: "evora"
  # Audit des émojis des catalogues : bloquant depuis E10 (EVORA-KIN-06).
  EVORA_EMOJI_GATE: "block"
  # Termes sensibles relus au rendu par le test de fumée : `measure` jusqu'à E9, puis `block`.
  EVORA_TERMS_GATE: "measure"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify the upstream tag
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            evora/v*) ;;
            *) echo "::error::la branche $ref n'est pas de la forme evora/<tag>"; exit 1 ;;
          esac
          tag="${ref#evora/}"
          # [workspace.package] version, lue comme packaging/env.sh
          version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Cargo.toml annonce $version, la branche vise $tag"
            exit 1
          fi
          # La version du CLI épinglée ici doit être celle qu'exigent xtask et Cargo.lock.
          xtask_wb="$(sed -n 's/^const WASM_BINDGEN: &str = "\(.*\)";$/\1/p' xtask/src/main.rs)"
          lock_wb="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          if [ "$xtask_wb" != "$WASM_BINDGEN_CLI" ] || [ "$lock_wb" != "$WASM_BINDGEN_CLI" ]; then
            echo "::error::wasm-bindgen épinglé $WASM_BINDGEN_CLI, xtask $xtask_wb, Cargo.lock $lock_wb"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "name=evora-effectcraft-web-$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Tag amont $tag, version $version, commit $(git rev-parse HEAD)"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} (rustup)
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo "::error::rustup absent de l'image du runner"; exit 1; }
          rustup --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUST_TOOLCHAIN" wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" rustc --version --verbose
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" cargo --version

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: evora-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-cargo-${{ runner.os }}-

      - name: Cache wasm-bindgen CLI
        id: wbcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-tools/wasm-bindgen
          key: evora-wasm-bindgen-cli-${{ env.WASM_BINDGEN_CLI }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen CLI ${{ env.WASM_BINDGEN_CLI }}
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_CLI" --locked --root "$HOME/.evora-tools/wasm-bindgen"

      - name: Check tools
        run: |
          set -euo pipefail
          echo "$HOME/.evora-tools/wasm-bindgen/bin" >> "$GITHUB_PATH"
          wb="$("$HOME/.evora-tools/wasm-bindgen/bin/wasm-bindgen" --version)"
          echo "$wb"
          case "$wb" in
            *"$WASM_BINDGEN_CLI"*) ;;
            *) echo "::error::wasm-bindgen $wb au lieu de $WASM_BINDGEN_CLI"; exit 1 ;;
          esac
          if command -v wasm-opt >/dev/null; then
            echo "::notice::wasm-opt présent sur le runner ($(wasm-opt --version)) : xtask l'appliquera"
          else
            echo "wasm-opt absent : xtask saute l'optimisation binaryen (comme la release amont)"
          fi

      - name: Install audit tools (cargo-deny ${{ env.CARGO_DENY_VERSION }}, cargo-about ${{ env.CARGO_ABOUT_VERSION }}, SHA-256 pinned)
        run: |
          set -euo pipefail
          bin="$HOME/.evora-tools/audit/bin"
          mkdir -p "$bin"
          fetch() {
            local name="$1" ver="$2" sum="$3"
            local tgz="$name-$ver-x86_64-unknown-linux-musl.tar.gz"
            local dl="$RUNNER_TEMP/evora-dl/$name"
            mkdir -p "$dl"
            curl -fsSL --retry 3 -o "$dl/$tgz" "https://github.com/EmbarkStudios/$name/releases/download/$ver/$tgz"
            echo "$sum  $dl/$tgz" | sha256sum -c -
            tar -xzf "$dl/$tgz" -C "$dl"
            local exe
            exe="$(find "$dl" -type f -name "$name" | head -n 1)"
            [ -n "$exe" ] || { echo "::error::$name introuvable dans $tgz"; exit 1; }
            install -m 0755 "$exe" "$bin/$name"
          }
          fetch cargo-deny "$CARGO_DENY_VERSION" "$CARGO_DENY_SHA256"
          fetch cargo-about "$CARGO_ABOUT_VERSION" "$CARGO_ABOUT_SHA256"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/cargo-deny" --version | tee /dev/stderr | grep -qF "$CARGO_DENY_VERSION" || { echo "::error::cargo-deny n'est pas $CARGO_DENY_VERSION"; exit 1; }
          "$bin/cargo-about" --version | tee /dev/stderr | grep -qF "$CARGO_ABOUT_VERSION" || { echo "::error::cargo-about n'est pas $CARGO_ABOUT_VERSION"; exit 1; }

      - name: Runner tools of the gates (versions)
        run: |
          set -euo pipefail
          google-chrome --version
          node --version
          python3 --version
          perl -MUnicode::UCD -e 'printf "perl %vd, Unicode %s\n", $^V, Unicode::UCD::UnicodeVersion()'
          brotli --version
          gzip --version | head -n 1
          zip -v | sed -n 2p
          if node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)'; then
            echo "NODE_WS=" >> "$GITHUB_ENV"
          else
            echo "NODE_WS=--experimental-websocket" >> "$GITHUB_ENV"
            echo "Node sans WebSocket global : --experimental-websocket"
          fi

      - name: Gate witnesses (every detector must see what it is shown)
        run: python3 .github/evora/gates.py witness

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Licences and advisories (cargo-deny, web crate graph, wasm32)
        run: |
          set -euo pipefail
          cargo deny --manifest-path apps/effectcraft-web/Cargo.toml --locked check --show-stats advisories licenses

      - name: Build the web app (cargo xtask web, release)
        run: |
          set -euo pipefail
          cargo xtask web
          git diff --exit-code -- Cargo.lock || { echo "::error::le build a modifié Cargo.lock"; exit 1; }

      - name: Third-party licences (cargo-about)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evora-about"
          cargo about generate --manifest-path apps/effectcraft-web/Cargo.toml --locked --fail \
            -c .github/evora/about.toml -o "$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt" \
            .github/evora/third-party-licenses.hbs
          f="$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt"
          [ -s "$f" ] || { echo "::error::cargo-about n'a rien produit"; exit 1; }
          echo "THIRD-PARTY-LICENSES.txt : $(wc -c < "$f") octets, $(grep -c '^- .* crates)$' "$f") licences, $(grep -cE '^- [A-Za-z0-9_-]+ [0-9]' "$f") mentions de crates"
          sed -n '/^Overview/,/^---/p' "$f"

      - name: Package the static site
        id: pkg
        env:
          NAME: ${{ steps.meta.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          site="target/web/dist"
          [ -f "$site/index.html" ] || { echo "::error::$site/index.html manquant"; exit 1; }
          # Les URL doivent rester relatives : le site est servi sous un sous-chemin.
          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo "::error::$site/index.html contient des URL absolues depuis la racine"
            exit 1
          fi
          work="$RUNNER_TEMP/evora-pkg"
          out="$RUNNER_TEMP/evora-out"
          mkdir -p "$work/$NAME/LICENSES" "$out"
          cp -R "$site/." "$work/$NAME/"
          # Aucune configuration d'hébergement (_headers, .htaccess) : l'hôte Evora pose ses en-têtes.
          # Licences et mentions amont conservées (MIT OR Apache-2.0, NOTICE, polices OFL), licences
          # tierces agrégées par cargo-about, mention Evora en texte simple.
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$work/$NAME/LICENSES/"
          cp assets/fonts/OFL-*.txt "$work/$NAME/LICENSES/"
          cp "$RUNNER_TEMP/evora-about/THIRD-PARTY-LICENSES.txt" "$work/$NAME/LICENSES/"
          sed -e "s/__TAG__/$TAG/g" -e "s/__COMMIT__/$(git rev-parse HEAD)/g" .github/evora/NOTICE-EVORA.txt > "$work/$NAME/LICENSES/NOTICE-EVORA.txt"
          # Copies précompressées pour l'origine du moteur (Content-Encoding br et gzip).
          (
            cd "$work/$NAME"
            find . -type f -not -path './LICENSES/*' \( -name '*.wasm' -o -name '*.js' -o -name '*.mjs' -o -name '*.html' \
              -o -name '*.svg' -o -name '*.webmanifest' -o -name '*.json' -o -name '*.css' \) -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' f; do
                gzip -9 -n -k "$f"
                brotli -q 11 -k "$f"
              done
          )
          {
            echo "dir=$work/$NAME"
            echo "work=$work"
            echo "out=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Gates on the site (hosting files, ArtCraft marks, .br/.gz, CSP hashes, sizes)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: python3 .github/evora/gates.py site --dir "$DIR"

      - name: Gate on the displayed catalogues (emoji and symbols, E10)
        run: python3 .github/evora/gates.py catalog --repo . --stacks "$EVORA_FONT_STACKS" --mode "$EVORA_EMOJI_GATE"

      - name: Smoke test (headless Chrome, engine framed by another origin)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/evora-smoke"
          mkdir -p "$smoke/parent"
          PB=8602; PA=8601; PC=8603; PS=8604
          hashes="$(grep -o "^'sha256-[^']*'" "$DIR/csp-hashes.txt" | tr '\n' ' ')"
          [ -n "$hashes" ] || { echo "::error::csp-hashes.txt vide"; exit 1; }
          # La CSP prévue pour les documents du moteur (apps/kinetika/CLAUDE.md §6.5), le parent
          # tenant lieu d'origine Evora.
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' ${hashes}; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors http://127.0.0.1:$PB; object-src 'none'; base-uri 'none'"
          sabotaged="${csp//sha256-/sha256-SABOTAGE}"
          for p in "$PA" "$PC" "$PS"; do
            cat > "$smoke/parent/engine-$p.html" <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Evora smoke parent</title><link rel="icon" href="data:,"></head>
          <body style="margin:0"><iframe id="engine" src="http://127.0.0.1:$p/index.html?storage=memory&amp;nosw" style="border:0;width:1360px;height:860px" allow="fullscreen; clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin"></iframe></body></html>
          HTML
          done
          python3 .github/evora/serve.py --root "$smoke/parent" --port "$PB" > "$smoke/serve-parent.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PA" > "$smoke/serve-plain.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PC" --header "Content-Security-Policy: $csp" > "$smoke/serve-csp.log" 2>&1 &
          python3 .github/evora/serve.py --root "$DIR" --port "$PS" --header "Content-Security-Policy: $sabotaged" > "$smoke/serve-sabotage.log" 2>&1 &
          for p in "$PB" "$PA" "$PC" "$PS"; do
            for _ in $(seq 1 50); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$p/" || true)"
              [ "$code" != "000" ] && break
              sleep 0.2
            done
            [ "$code" != "000" ] || { echo "::error::serveur du port $p muet"; exit 1; }
          done
          curl -fsSI "http://127.0.0.1:$PA/effectcraft_web_bg.wasm" | grep -i '^content-type'
          echo "CSP prévue : $csp"
          rc=0
          node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PA.html" --engine="http://127.0.0.1:$PA" \
            --label=cross-origin --out="$smoke" --terms="$EVORA_TERMS_GATE" || rc=1
          node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PC.html" --engine="http://127.0.0.1:$PC" \
            --label=csp --out="$smoke" --terms="$EVORA_TERMS_GATE" || rc=1
          # Témoin saboté : sous une empreinte CSP fausse le moteur ne doit pas démarrer, et le test le dit.
          if node $NODE_WS .github/evora/smoke.mjs --parent="http://127.0.0.1:$PB/engine-$PS.html" --engine="http://127.0.0.1:$PS" \
            --label=csp-sabotage --out="$smoke" --timeout=30000 --settle=500 > "$smoke/sabotage.out" 2>&1; then
            echo "::error::témoin saboté : le test de fumée passe sous une empreinte CSP fausse"
            rc=1
          elif ! grep -q 'SMOKE_CSP .*script-src' "$smoke/sabotage.out"; then
            cat "$smoke/sabotage.out"
            echo "::error::témoin saboté : échec sans violation de script-src relevée"
            rc=1
          else
            echo "Témoin saboté OK : $(grep '^SMOKE ' "$smoke/sabotage.out")"
          fi
          kill $(jobs -p) 2>/dev/null || true
          exit "$rc"

      - name: Archive (zip and SHA256SUMS)
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          WORK: ${{ steps.pkg.outputs.work }}
          OUT: ${{ steps.pkg.outputs.out }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          # Archive reproductible : dates fixées au commit, ordre trié, sans attributs étendus ; les
          # fichiers déjà compressés (.br, .gz, .png) sont stockés tels quels.
          epoch="$(git log -1 --format=%ct)"
          (
            cd "$WORK"
            find "$NAME" -exec touch -h -d "@$epoch" {} +
            find "$NAME" -type f | LC_ALL=C sort | zip -q -X -9 -n .br:.gz:.png "$OUT/$NAME.zip" -@
          )
          cp "$DIR/csp-hashes.txt" "$OUT/csp-hashes.txt"
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS)
          cat "$OUT/SHA256SUMS"
          ls -l "$OUT"
          {
            echo "### Archive"
            echo
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| Archive | \`$NAME.zip\`, $(stat -c %s "$OUT/$NAME.zip") octets |"
            echo "| SHA-256 | \`$(sha256sum "$OUT/$NAME.zip" | cut -d' ' -f1)\` |"
            echo
            echo '```'
            (cd "$DIR" && find . -type f -printf '%10s  %P\n' | LC_ALL=C sort -k2)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ARCHIVE_FILES"
          (cd "$DIR" && find . -type f -printf '%10s  %P\n' | LC_ALL=C sort -k2)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.out }}/${{ steps.meta.outputs.name }}.zip
            ${{ steps.pkg.outputs.out }}/SHA256SUMS
            ${{ steps.pkg.outputs.out }}/csp-hashes.txt
          if-no-files-found: error
          compression-level: 0

      # Empreinte seule, en artefact séparé : vérifiable sans télécharger l'archive.
      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-SHA256SUMS
          path: ${{ steps.pkg.outputs.out }}/SHA256SUMS
          if-no-files-found: error

      # Rapport du test de fumée (JSON, captures), aussi en cas d'échec, pour le diagnostic.
      - name: Upload smoke report
        if: always() && steps.meta.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-smoke
          path: ${{ runner.temp }}/evora-smoke/
          if-no-files-found: warn
          retention-days: 30
