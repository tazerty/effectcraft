<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Evora EHP smoke parent</title>
<link rel="icon" href="data:,">
</head>
<body style="margin:0;background:#fff">
<!-- The engine is the first frame: the rogue pages reach it as parent.frames[0]. -->
<iframe id="engine" style="border:0;width:1360px;height:860px" allow="fullscreen; clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin"></iframe>
<iframe id="rogue-source" style="border:0;width:8px;height:8px"></iframe>
<iframe id="rogue-origin" style="border:0;width:8px;height:8px"></iframe>
<script>
"use strict";
// Banc « pont-ehp » (écrit par Evora ; patchs E4 et E5) : une coquille minimale qui parle EHP v1
// (HOST-PROTOCOL.md d'Evora) au moteur, servi par une autre origine qui admet celle-ci dans
// evora-host.json. Le cadre du moteur charge d'abord la page d'amorçage du banc (evora-seed.html,
// sur l'origine du moteur), qui sème des magasins étrangers puis ouvre le moteur. La coquille
// vérifie source et origine, journalise tout ce qui arrive, répond à evora:ready par un
// evora:init de version 2 (doit rester sans réponse) puis par un evora:init valide, ouvre un
// petit projet en octets, répond à chaque evora:save par un evora:saved ; le reste est piloté par
// smoke.mjs (window.__ehp.step). Pont V1 (lot KIN-FK-B1) : la coquille répond aussi à evora:export
// (accusé), à evora:pick (deux images sous /evora/<uid>/ pour un import, le fichier du chemin pour
// une reliaison, « cancelled » pour une ouverture) et à evora:need (les images demandées, par leur
// nom, puis l'accusé de clôture) ; elle peut refuser le prochain enregistrement (failNext).
const q = new URLSearchParams(location.search);
const ENGINE = q.get("engine");
const ROGUE = q.get("rogue");
const NS = q.get("ns");
const EQ = q.get("q") || "";
const PREFS = JSON.parse(q.get("prefs") || "{}");
const MAX_BYTES = 4 * 1024 * 1024;
const CROCKFORD = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
let serial = 0;
const ulid = () => {
  serial += 1;
  return "01JZ".padEnd(24, "Z") + CROCKFORD[(serial >> 5) % 32] + CROCKFORD[serial % 32];
};
// A project as small as the engine reads it (crates/project: schema 2, no item).
const PROJECT = JSON.stringify({
  schema: 2,
  settings: { bit_depth: "Bpc8", linearize: false, time_display: "Timecode", frame_start: 0, audio_sample_rate: 48000, comment: "evora-smoke" },
  items: {},
  next_id: 1,
});
// `seq` numbers every message the page receives, in the order it receives them: two messages the
// engine posts in the same task often arrive in the same millisecond, so the order of evora:save
// and evora:dirty is judged by `seq`, never by `at`.
// Two small PNG images (4 × 4, red and blue) the Evora page « holds in Drive ».
const MEDIA = {
  "rouge.png": "iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR4nGO4IycHRwzEcQDTIxGBFNCZswAAAABJRU5ErkJggg==",
  "bleu.png": "iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR4nGOQs7kDRwzEcQDsIxNhKYyREgAAAABJRU5ErkJggg==",
};
const mediaBytes = (name) => Uint8Array.from(atob(MEDIA[name]), (c) => c.charCodeAt(0)).buffer;
// Drive uids of the imported media (U1) and of the same media under the reopened project (U2).
const U1 = "01JZMEDA0000000000000000AA";
const U2 = "01JZMEDB0000000000000000BB";
const S = (window.__ehp = { log: [], ids: {}, harness: [], saves: [], acks: {}, version: 1, seq: 0, failNext: 0, exports: [], picks: [], needs: [], texts: {} });
const engine = document.getElementById("engine");
const rogueSource = document.getElementById("rogue-source");
const rogueOrigin = document.getElementById("rogue-origin");
// Wall-clock milliseconds: the engine's frame stamps its deletions on the same clock (smoke.mjs).
const now = () => Date.now();
const send = (m, transfer) => engine.contentWindow.postMessage(m, ENGINE, transfer || []);
// A payload for the log: binary data as {arrayBuffer, byteLength}, a view or a shared buffer flagged.
const describe = (v) =>
  JSON.parse(
    JSON.stringify(v === undefined ? null : v, (k, x) => {
      if (x instanceof ArrayBuffer) return { arrayBuffer: true, byteLength: x.byteLength };
      if (typeof SharedArrayBuffer !== "undefined" && x instanceof SharedArrayBuffer) return { sharedArrayBuffer: true };
      if (ArrayBuffer.isView(x)) return { view: true };
      return x;
    }),
  );

addEventListener("message", (e) => {
  const d = e.data;
  const at = now();
  S.seq += 1;
  const seq = S.seq;
  const fromEngineFrame = e.source === engine.contentWindow;
  const fromRogue = e.source === rogueSource.contentWindow || e.source === rogueOrigin.contentWindow;
  // The bench's own reports (the seed page before the engine starts, the rogue frames): not EHP.
  if (d && typeof d === "object" && typeof d.harness === "string" && ((fromEngineFrame && d.harness === "seed" && !S.ids.ready) || fromRogue)) {
    S.harness.push({ at, seq, origin: e.origin, report: describe(d) });
    return;
  }
  const fromEngine = fromEngineFrame && e.origin === ENGINE;
  const plain = d !== null && typeof d === "object" && Object.getPrototypeOf(d) === Object.prototype;
  S.log.push({
    at,
    seq,
    origin: e.origin,
    fromEngine,
    plain,
    keys: plain ? Object.keys(d) : [],
    v: plain ? d.v : null,
    type: plain ? d.type : null,
    id: plain ? d.id : null,
    re: plain && d.re !== undefined ? d.re : null,
    payload: plain ? describe(d.payload) : null,
  });
  if (!fromEngine || !plain || d.v !== 1) return;
  const p = d.payload || {};
  if (d.type === "evora:ready") {
    if (S.ids.ready) return;
    S.ids.ready = d.id;
    S.ids.v2init = ulid();
    send({ v: 2, type: "evora:init", id: S.ids.v2init, re: d.id, payload: {} });
    S.ids.init = ulid();
    send({
      v: 1,
      type: "evora:init",
      id: S.ids.init,
      re: d.id,
      payload: {
        // Light at start: the engine's default is dark, so a theme left unapplied can't pass.
        lang: "fr", engineLang: "fr", theme: "light", accent: "#4F46E5", readOnly: false, storageNs: NS,
        capabilities: Array.isArray(p.capabilities) ? p.capabilities : [], prefs: PREFS,
        limits: { maxDocumentBytes: MAX_BYTES, maxExportBytes: MAX_BYTES },
      },
    });
  } else if (d.type === "evora:ack") {
    S.acks[d.re] = { at, seq, payload: describe(p) };
  } else if (d.type === "evora:save") {
    const entry = {
      at, seq, id: d.id, re: d.re !== undefined ? d.re : null, docRef: p.docRef, name: p.name, saveAs: p.saveAs,
      arrayBuffer: p.bytes instanceof ArrayBuffer, byteLength: p.bytes instanceof ArrayBuffer ? p.bytes.byteLength : -1, items: null,
    };
    try {
      const text = new TextDecoder().decode(p.bytes);
      S.texts[d.id] = text;
      entry.items = Object.keys(JSON.parse(text).items || {}).length;
    } catch (err) {
      entry.parseError = String(err);
    }
    // The host's answer: a new version; a Save As is a new document (§7.3). `failNext`: the next
    // save is refused (doc.saved-ack: the engine must stay modified).
    let answer;
    if (S.failNext > 0) {
      S.failNext -= 1;
      answer = { ok: false, error: "server" };
    } else {
      S.version += 1;
      answer = { ok: true, version: S.version };
      if (p.saveAs === true) {
        S.ids.copy = ulid();
        answer.docRef = S.ids.copy;
      }
    }
    entry.answer = answer;
    S.saves.push(entry);
    send({ v: 1, type: "evora:saved", id: ulid(), re: d.id, payload: answer });
  } else if (d.type === "evora:export") {
    // An export to Drive (§7.4): its name, type and first bytes, then the host's answer.
    const bytes = p.bytes instanceof ArrayBuffer ? new Uint8Array(p.bytes) : null;
    S.exports.push({
      at, seq, id: d.id, docRef: p.docRef ?? null, name: p.name, mime: p.mime, arrayBuffer: !!bytes, byteLength: bytes ? bytes.byteLength : -1,
      magic: bytes ? Array.from(bytes.slice(0, 4), (b) => b.toString(16).padStart(2, "0")).join("") : "",
    });
    send({ v: 1, type: "evora:ack", id: ulid(), re: d.id, payload: { ok: true } });
  } else if (d.type === "evora:pick") {
    // Evora's picker (§7.6): two images for an import, the file under its path for a relink, the
    // document itself for an open (here: cancelled).
    S.picks.push({ at, seq, id: d.id, payload: describe(p) });
    const files = p.purpose === "import" ? ["rouge.png", "bleu.png"].map((n) => [`/evora/${U1}/${n}`, n]) : p.purpose === "relink" && p.forPath ? [[p.forPath, "rouge.png"]] : [];
    for (const [path, name] of files) {
      const bytes = mediaBytes(name);
      send({ v: 1, type: "evora:file", id: ulid(), re: d.id, payload: { path, name, bytes } }, [bytes]);
    }
    send({ v: 1, type: "evora:ack", id: ulid(), re: d.id, payload: files.length ? { ok: true } : { ok: false, code: "cancelled" } });
  } else if (d.type === "evora:need") {
    // A project's media (§7.5): each path under U2 answered with the image of its name, any other
    // with not_found, then the closing answer.
    S.needs.push({ at, seq, id: d.id, payload: describe(p) });
    for (const path of Array.isArray(p.paths) ? p.paths : []) {
      const name = String(path).split("/").pop();
      if (String(path).startsWith(`/evora/${U2}/`) && MEDIA[name]) {
        const bytes = mediaBytes(name);
        send({ v: 1, type: "evora:file", id: ulid(), re: d.id, payload: { path, name, bytes } }, [bytes]);
      } else {
        send({ v: 1, type: "evora:file", id: ulid(), re: d.id, payload: { path, error: "not_found" } });
      }
    }
    send({ v: 1, type: "evora:ack", id: ulid(), re: d.id, payload: { ok: true } });
  }
});

const request = (key, type, payload) => {
  S.ids[key] = ulid();
  send({ v: 1, type, id: S.ids[key], payload });
  return S.ids[key];
};
S.step = {
  // evora:open of a small project in bytes, once evora:init is accepted (smoke.mjs first waits for
  // the engine's first frames: see EHP_SETTLE_MS).
  open() {
    if (!S.acks[S.ids.init] || S.acks[S.ids.init].payload.ok !== true || S.ids.open) return false;
    S.ids.doc = ulid();
    S.ids.open = ulid();
    const bytes = new TextEncoder().encode(PROJECT).buffer;
    send({ v: 1, type: "evora:open", id: S.ids.open, payload: { docRef: S.ids.doc, name: "evora-smoke.ecproj", bytes } }, [bytes]);
    return true;
  },
  // The same evora:request-save from two windows that aren't the engine's parent (one on this
  // origin, one on an origin evora-host.json doesn't admit) and in version 2: none may be answered.
  rogue() {
    S.ids.rogueSource = ulid();
    S.ids.rogueOrigin = ulid();
    rogueSource.contentWindow.postMessage({ go: true, id: S.ids.rogueSource }, location.origin);
    rogueOrigin.contentWindow.postMessage({ go: true, id: S.ids.rogueOrigin }, ROGUE);
    S.ids.v2save = ulid();
    send({ v: 2, type: "evora:request-save", id: S.ids.v2save, payload: { reason: "user", docRef: S.ids.doc } });
    return true;
  },
  // The witness: the same request from the parent, answered (nothing to save yet: "clean").
  clean: () => request("clean", "evora:request-save", { reason: "user", docRef: S.ids.doc }),
  save: () => request("save", "evora:request-save", { reason: "autosave", docRef: S.ids.doc }),
  // The engine's frame shown or not painted (display: none): the browser gives an iframe it
  // doesn't paint no animation frame, even in a visible tab.
  hide(on) {
    engine.style.display = on ? "none" : "";
    return engine.style.display;
  },
  // What the Evora page asks when the editor's frame goes out of sight (§7.2): the document open
  // now (the copy after « Enregistrer sous »).
  hiddenSave: () => request("hidden", "evora:request-save", { reason: "visibility", docRef: S.ids.copy || S.ids.doc }),
  live() {
    request("theme", "evora:theme", { theme: "dark", accent: "#4F46E5" });
    request("lang", "evora:lang", { lang: "de", engineLang: "de" });
    return true;
  },
  live2: () => request("theme2", "evora:theme", { theme: "light", accent: "#4F46E5" }),
  // doc.saved-ack: the next save refused, then saves answered again.
  failNext() {
    S.failNext = 1;
    return true;
  },
  sack1: () => request("sack1", "evora:request-save", { reason: "user", docRef: S.ids.doc3 || S.ids.copy || S.ids.doc }),
  sack2: () => request("sack2", "evora:request-save", { reason: "user", docRef: S.ids.doc3 || S.ids.copy || S.ids.doc }),
  mediaSave: () => request("mediaSave", "evora:request-save", { reason: "user", docRef: S.ids.doc3 || S.ids.copy || S.ids.doc }),
  // The project saved with its two imported media, reopened as another document whose media sit
  // under other Drive uids (U2): the engine has none of them and must ask (evora:need).
  reopen() {
    const save = S.saves.find((v) => v.re === S.ids.mediaSave);
    const text = save ? S.texts[save.id] : null;
    if (!text || !text.includes(`/evora/${U1}/`)) return false;
    const bytes = new TextEncoder().encode(text.split(`/evora/${U1}/`).join(`/evora/${U2}/`)).buffer;
    S.ids.doc3 = ulid();
    S.ids.reopen = ulid();
    send({ v: 1, type: "evora:open", id: S.ids.reopen, payload: { docRef: S.ids.doc3, name: "evora-medias.ecproj", bytes } }, [bytes]);
    return true;
  },
  purge: () => request("purge", "evora:purge", { scope: "current" }),
};

engine.src = `${ENGINE}/evora-seed.html?parent=${encodeURIComponent(location.origin)}&own=${encodeURIComponent(NS)}&q=${encodeURIComponent(EQ)}`;
const rogueQuery = `?engine=${encodeURIComponent(ENGINE)}&parent=${encodeURIComponent(location.origin)}`;
rogueSource.src = `${location.origin}/ehp-rogue.html${rogueQuery}`;
rogueOrigin.src = `${ROGUE}/ehp-rogue.html${rogueQuery}`;
</script>
</body>
</html>
