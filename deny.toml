# cargo-deny configuration of the Evora fork (written by Evora; the upstream repository has none).
# Checked by .github/workflows/evora-web.yml: `cargo deny --manifest-path
# apps/effectcraft-web/Cargo.toml check advisories licenses`, i.e. the crate graph of the web
# build only (the shipped artefact), for the wasm32 target, without dev-dependencies.
#
# Nothing is relaxed silently: every allowed licence is listed below with the reason it is
# acceptable, every ignored advisory must carry an `id` and a `reason`, and cargo-deny's
# warnings stay in the job log.

[graph]
targets = ["wasm32-unknown-unknown"]
exclude-dev = true

[advisories]
# RustSec advisory database (default). Vulnerabilities always fail; unmaintained and unsound
# advisories fail for every crate of the graph (stricter than cargo-deny's `workspace` default
# for `unsound`); a yanked crate version fails.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only, as the upstream AGENTS.md requires (MIT, Apache, BSD, ISC, Zlib,
# unmodified MPL-2.0), plus the Unicode data licence of the Unicode tables crates.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# The workspace crates are `MIT OR Apache-2.0` (Cargo.toml) and are checked like the others.
ignore = false
